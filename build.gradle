plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.seleniumhq.selenium:selenium-java:4.48.0'

    testImplementation 'org.testng:testng:7.4.0'
}

application {
    mainClass = 'org.example.Main'
}

test {
    useTestNG()
}

tasks.register('copyWebsite', Copy) {
    from 'src/main/resources'
    into 'docs'
}

tasks.named('build') {
    dependsOn 'copyWebsite'
}